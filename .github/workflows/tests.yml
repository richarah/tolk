name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The parser (ACE) and the grammar image, fetched from their download addresses by the script and cached between runs.
      - uses: actions/cache@v4
        with:
          path: erg
          key: erg-${{ hashFiles('scripts/setup_erg.sh') }}
      - run: sh scripts/setup_erg.sh
      - run: pip install -e '.[test]'
      - run: python -m pytest --collect-only -q | tail -1
      - run: python -m pytest -q
