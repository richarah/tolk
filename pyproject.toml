[project]
name = "tolk"
version = "0.1.4"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["pydelphin"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tolk", "tolk.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tolk = ["skeletons.json"]
